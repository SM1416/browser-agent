server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Never cache the app shell; the phone should always get the latest UI.
    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /app.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /style.css {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
